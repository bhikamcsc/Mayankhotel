<!DOCTYPE html>
<html>
<head>
  <title>Admin Login Test</title>
</head>

<body style="font-family:Arial;background:#111;color:white;text-align:center;padding-top:100px;">

  <h1>Mayank Restorent Admin</h1>

  <input
    id="pass"
    type="password"
    placeholder="Password"
    style="padding:15px;font-size:18px;"
  >

  <br><br>

  <button
    onclick="login()"
    style="padding:15px 40px;font-size:18px;"
  >
    Login
  </button>

  <div
    id="panel"
    style="display:none;margin-top:40px;"
  >

    <h2>✅ Login Success</h2>

    <p>
      Admin Panel Open Ho Gaya
    </p>

  </div>

  <script>

    function login(){

      var password =
      document.getElementById("pass").value;

      if(password === "12345"){

        document.getElementById(
          "panel"
        ).style.display = "block";

        alert("Login Success");

      }else{

        alert("Wrong Password");

      }

    }

  </script>

</body>
</html>
